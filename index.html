<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>포켓몬 30주년 띠부씰 도감</title>

  <style>
    :root {
      --red: #d71920;
      --dark-red: #9e1218;
      --yellow: #ffcb05;
      --blue: #2a75bb;
      --dark-blue: #1d4f8f;
      --cream: #fff8d8;
      --paper: #fffef4;
      --black: #191919;
      --line: rgba(0,0,0,.22);
      --muted: rgba(0,0,0,.62);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--black);
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,.25) 0 7%, transparent 8%),
        linear-gradient(135deg, #e51d2a 0%, #d71920 45%, #9e1218 100%);
      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .12;
      background-image:
        linear-gradient(rgba(255,255,255,.25) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.25) 1px, transparent 1px);
      background-size: 18px 18px;
      z-index: -1;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .start-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at center 42%, #fff 0 0.8%, transparent 1%),
        linear-gradient(#d71920 0 47%, #191919 47% 53%, #fffef4 53% 100%);
      transition: opacity .35s ease, transform .35s ease;
    }

    .start-screen.hide {
      opacity: 0;
      transform: scale(1.02);
      pointer-events: none;
    }

    .start-box {
      width: min(460px, 100%);
      background: rgba(255, 254, 244, .96);
      border: 5px solid #191919;
      border-radius: 26px;
      padding: 32px 24px 28px;
      text-align: center;
      box-shadow:
        0 12px 0 rgba(0,0,0,.28),
        inset 0 0 0 4px rgba(255,203,5,.65);
      position: relative;
      overflow: hidden;
    }

    .start-box::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 24px solid rgba(215,25,32,.12);
      right: -80px;
      top: -80px;
    }

    .start-kicker {
      margin: 0 0 8px;
      color: var(--dark-blue);
      font-size: 13px;
      font-weight: 1000;
      letter-spacing: .12em;
    }

    .start-title {
      margin: 0;
      font-size: clamp(38px, 9vw, 58px);
      font-weight: 1000;
      line-height: .92;
      letter-spacing: -0.075em;
      color: var(--yellow);
      text-shadow:
        3px 0 var(--blue),
        -3px 0 var(--blue),
        0 3px var(--blue),
        0 -3px var(--blue),
        4px 5px 0 var(--dark-blue);
    }

    .start-sub {
      margin: 20px 0 0;
      font-size: 15px;
      font-weight: 900;
      color: var(--muted);
      line-height: 1.45;
    }

    .press-start {
      margin-top: 28px;
      animation: blink 1s steps(2, start) infinite;
      color: var(--dark-red);
      font-size: 14px;
      font-weight: 1000;
      letter-spacing: .04em;
    }

    @keyframes blink {
      50% {
        opacity: .28;
      }
    }

    .start-btn {
      margin-top: 10px;
      width: 100%;
      padding: 17px 18px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ff3945, #d71920);
      color: #fff;
      font-size: 22px;
      font-weight: 1000;
      border: 3px solid #191919;
      box-shadow: 0 7px 0 rgba(0,0,0,.35);
      transition: transform .08s ease, box-shadow .08s ease, filter .15s ease;
    }

    .start-btn:hover {
      filter: brightness(1.06);
      transform: translateY(-2px);
    }

    .start-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0,0,0,.35);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 18px 16px 14px;
      text-align: center;
      background:
        linear-gradient(180deg, rgba(255,248,216,.97), rgba(255,248,216,.92));
      border-bottom: 5px solid #191919;
      box-shadow: 0 4px 0 rgba(0,0,0,.18);
      backdrop-filter: blur(8px);
    }

    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 4vw, 44px);
      font-weight: 1000;
      letter-spacing: -0.055em;
      line-height: 1.05;
    }

    .red {
      color: var(--red);
    }

    .sub {
      margin: 0;
      font-size: clamp(14px, 2vw, 19px);
      font-weight: 900;
      color: rgba(0,0,0,.76);
    }

    .notice {
      margin-top: 5px;
      font-size: 14px;
      font-weight: 900;
      color: rgba(0,0,0,.58);
      letter-spacing: -0.02em;
      text-align: left;
      max-width: 1100px;
      margin-left: auto;
      margin-right: auto;
      padding-left: 4px;
    }

    .toolbar {
      max-width: 1100px;
      margin: 16px auto 0;
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .progress-wrap {
      min-width: min(460px, 100%);
      background: #fff;
      border: 3px solid #191919;
      border-radius: 999px;
      overflow: hidden;
      height: 36px;
      position: relative;
      box-shadow: 0 3px 0 rgba(0,0,0,.18);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--yellow), #ffdf4d);
      transition: width .22s ease;
    }

    .progress-text {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-weight: 1000;
      font-size: 14px;
      color: #111;
      text-shadow: 0 1px 0 rgba(255,255,255,.8);
    }

    .search,
    .tool-btn {
      border: 3px solid #191919;
      background: #fffef4;
      color: #111;
      font-weight: 1000;
      border-radius: 999px;
      box-shadow: 0 3px 0 rgba(0,0,0,.20);
    }

    .search {
      width: min(260px, 100%);
      padding: 10px 14px;
      outline: none;
    }

    .search:focus {
      background: #fff;
      outline: 3px solid rgba(42,117,187,.25);
    }

    .tool-btn {
      padding: 9px 14px;
      transition: transform .08s ease, box-shadow .08s ease;
    }

    .tool-btn:hover {
      transform: translateY(-1px);
    }

    .tool-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(0,0,0,.20);
    }

    main {
      max-width: 1120px;
      margin: 24px auto 54px;
      padding: 0 14px;
    }

    .dex-frame {
      background: rgba(255,248,216,.86);
      border: 5px solid #191919;
      border-radius: 22px;
      padding: 14px;
      box-shadow: 0 8px 0 rgba(0,0,0,.24);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      gap: 12px;
    }

    .sticker-card {
      border: 3px solid #191919;
      background: var(--paper);
      padding: 7px 7px 9px;
      box-shadow: 0 4px 0 rgba(0,0,0,.22);
      border-radius: 12px;
      position: relative;
      cursor: pointer;
      outline-offset: 3px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: transform .08s ease, box-shadow .08s ease, background .12s ease;
    }

    .sticker-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 rgba(0,0,0,.22);
    }

    .sticker-card:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0,0,0,.22);
    }

    .image-wrap {
      position: relative;
      aspect-ratio: 68 / 93;
      width: 100%;
    }

    .sticker-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #fff;
      border-radius: 6px;
      border: 2px solid rgba(0,0,0,.42);
      transition: filter .18s ease, opacity .18s ease, transform .18s ease;
    }

    .sticker-card:hover img {
      transform: scale(1.02);
    }

    .sticker-card:not(.collected) {
      background: rgba(255,255,255,.74);
    }

    .sticker-card:not(.collected) img {
      filter: grayscale(1) contrast(.95) brightness(.82);
      opacity: .55;
    }

    .sticker-card.collected {
      background: #fff;
      outline: 4px solid rgba(255,203,5,.72);
    }

    .count-badge {
      position: absolute;
      inset: auto 6px 6px 6px;
      padding: 4px 0;
      border-radius: 999px;
      background: rgba(25,25,25,.82);
      color: #fff;
      font-size: 12px;
      font-weight: 1000;
      text-align: center;
      letter-spacing: -0.02em;
      border: 1px solid rgba(255,255,255,.25);
    }

    .minus-btn {
      position: absolute;
      right: 5px;
      top: 5px;
      z-index: 3;
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 999px;
      background: linear-gradient(180deg, #ff3945, #d71920);
      color: #fff;
      border: 2px solid #191919;
      font-size: 18px;
      line-height: 1;
      font-weight: 1000;
      display: none;
      place-items: center;
      box-shadow: 0 2px 0 rgba(0,0,0,.35);
    }

    .sticker-card.collected .minus-btn {
      display: grid;
    }

    .no-badge {
      position: absolute;
      left: 5px;
      top: 5px;
      z-index: 2;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(255,255,255,.93);
      border: 2px solid rgba(0,0,0,.55);
      font-size: 11px;
      font-weight: 1000;
    }

    .pokemon-name {
      min-height: 24px;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 1000;
      letter-spacing: -0.055em;
      line-height: 1.15;
      color: #111;
      word-break: keep-all;
      text-align: center;
    }

    .empty {
      grid-column: 1 / -1;
      background: rgba(255,255,255,.86);
      border: 3px solid #191919;
      border-radius: 14px;
      padding: 28px 16px;
      text-align: center;
      font-weight: 1000;
      box-shadow: 0 4px 0 rgba(0,0,0,.18);
    }

    footer {
      text-align: center;
      padding: 0 16px 34px;
      color: rgba(255,255,255,.86);
      font-size: 13px;
      font-weight: 800;
      text-shadow: 0 1px 0 rgba(0,0,0,.25);
    }

    @media (max-width: 520px) {
      header {
        padding-top: 14px;
      }

      .notice {
        font-size: 12px;
      }

      .grid {
        grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
      }

      .dex-frame {
        padding: 10px;
        border-width: 4px;
      }
    }
  </style>
</head>

      {'no': 95, 'name': '썬더', 'image': 'assets/sticker_095.png'},
      {'no': 96, 'name': '파이어', 'image': 'assets/sticker_096.png'},
      {'no': 97, 'name': '미뇽', 'image': 'assets/sticker_097.png'},
      {'no': 98, 'name': '신뇽', 'image': 'assets/sticker_098.png'},
      {'no': 99, 'name': '망나뇽', 'image': 'assets/sticker_099.png'},
      {'no': 100, 'name': '뮤츠', 'image': 'assets/sticker_100.png'}
    ];

    const TOTAL = STICKERS.length;
    const STORAGE_KEY = "pokemon-30th-sticker-dex-owned-counts";

    const startScreen = document.getElementById("startScreen");
    const gameStartBtn = document.getElementById("gameStartBtn");
    const bgm = document.getElementById("bgm");
    const clickSound = document.getElementById("clickSound");

    const grid = document.getElementById("grid");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");
    const resetBtn = document.getElementById("resetBtn");
    const showMissingBtn = document.getElementById("showMissing");
    const searchInput = document.getElementById("searchInput");

    let owned = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    let missingOnly = false;
    let query = "";

    function playClickSound() {
      if (!clickSound) return;

      try {
        clickSound.currentTime = 0;
        clickSound.play();
      } catch (e) {
        console.log("click sound blocked or missing");
      }
    }

    function startBgm() {
      if (!bgm) return;

      bgm.volume = 0.25;

      bgm.play().catch(() => {
        console.log("BGM blocked or missing");
      });
    }

    gameStartBtn.addEventListener("click", () => {
      playClickSound();
      startBgm();

      startScreen.classList.add("hide");

      setTimeout(() => {
        startScreen.remove();
      }, 360);
    });

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(owned));
    }

    function getOwnedCount(no) {
      return Number(owned[no] || 0);
    }

    function addOne(no) {
      owned[no] = getOwnedCount(no) + 1;
      save();
      render();
      updateProgress();
    }

    function minusOne(no) {
      const current = getOwnedCount(no);

      if (current <= 1) {
        delete owned[no];
      } else {
        owned[no] = current - 1;
      }

      save();
      render();
      updateProgress();
    }

    function getCollectedCount() {
      return STICKERS.filter((sticker) => getOwnedCount(sticker.no) > 0).length;
    }

    function getTotalOwnedCount() {
      return STICKERS.reduce((sum, sticker) => sum + getOwnedCount(sticker.no), 0);
    }

    function updateProgress() {
      const collectedCount = getCollectedCount();
      const totalOwnedCount = getTotalOwnedCount();
      const percent = Math.round((collectedCount / TOTAL) * 100);

      progressBar.style.width = `${percent}%`;
      progressText.textContent = `${collectedCount} / ${TOTAL} 수집 · 총 ${totalOwnedCount}장 · ${percent}%`;
    }

    function render() {
      grid.innerHTML = "";

      const filtered = STICKERS.filter((sticker) => {
        const count = getOwnedCount(sticker.no);
        const noText = String(sticker.no);
        const paddedNoText = String(sticker.no).padStart(3, "0");

        if (missingOnly && count > 0) return false;

        if (
          query &&
          !sticker.name.includes(query) &&
          !noText.includes(query) &&
          !paddedNoText.includes(query)
        ) {
          return false;
        }

        return true;
      });

      if (filtered.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "표시할 스티커가 없습니다.";
        grid.appendChild(empty);
        return;
      }

      for (const sticker of filtered) {
        const count = getOwnedCount(sticker.no);
        const isCollected = count > 0;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "sticker-card" + (isCollected ? " collected" : "");
        btn.title = `${String(sticker.no).padStart(3, "0")}번 ${sticker.name} · 보유 ${count}장`;
        btn.setAttribute("aria-label", btn.title);

        const imageWrap = document.createElement("div");
        imageWrap.className = "image-wrap";

        const badge = document.createElement("span");
        badge.className = "no-badge";
        badge.textContent = `#${String(sticker.no).padStart(3, "0")}`;

        const minusBtn = document.createElement("button");
        minusBtn.type = "button";
        minusBtn.className = "minus-btn";
        minusBtn.textContent = "－";
        minusBtn.title = `${sticker.name} 보유 개수 1개 줄이기`;
        minusBtn.setAttribute("aria-label", minusBtn.title);

        minusBtn.addEventListener("click", (event) => {
          event.stopPropagation();
          playClickSound();
          minusOne(sticker.no);
        });

        const img = document.createElement("img");
        img.src = sticker.image;
        img.alt = `${sticker.name} 포켓몬 스티커`;
        img.loading = "lazy";

        const countBadge = document.createElement("div");
        countBadge.className = "count-badge";
        countBadge.textContent = isCollected ? `보유 ${count}장` : "미수집";

        const name = document.createElement("div");
        name.className = "pokemon-name";
        name.textContent = sticker.name;

        imageWrap.appendChild(badge);
        imageWrap.appendChild(minusBtn);
        imageWrap.appendChild(img);
        imageWrap.appendChild(countBadge);

        btn.appendChild(imageWrap);
        btn.appendChild(name);

        btn.addEventListener("click", () => {
          playClickSound();
          addOne(sticker.no);
        });

        grid.appendChild(btn);
      }
    }

    resetBtn.addEventListener("click", () => {
      playClickSound();

      if (!confirm("보유 개수를 전부 초기화할까요?")) return;

      owned = {};
      save();
      render();
      updateProgress();
    });

    showMissingBtn.addEventListener("click", () => {
      playClickSound();

      missingOnly = !missingOnly;
      showMissingBtn.textContent = missingOnly ? "전체 보기" : "미수집만 보기";
      render();
    });

    searchInput.addEventListener("input", (event) => {
      query = event.target.value.trim();
      render();
    });

    render();
    updateProgress();
  </script>
</body>
</html>
