<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>포켓몬 30주년 띠부씰 도감</title>
  <style>
    :root {
      --bg: #f7c600;
      --card: #ffffff;
      --text: #161616;
      --muted: #666;
      --line: rgba(0,0,0,.14);
      --accent: #e60012;
      --blue: #2563eb;
      --green: #16a34a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .hidden {
      display: none !important;
    }

    .start-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
      background:
        radial-gradient(circle at top, rgba(255,255,255,.45), transparent 34%),
        linear-gradient(180deg, #f7c600, #efb900);
    }

    .start-box {
      width: min(520px, 100%);
      background: rgba(255,255,255,.9);
      border: 3px solid #111;
      border-radius: 22px;
      padding: 26px 18px 22px;
      text-align: center;
      box-shadow: 0 8px 0 rgba(0,0,0,.22);
    }

    .start-title {
      margin: 0 0 8px;
      font-size: clamp(28px, 8vw, 48px);
      font-weight: 1000;
      letter-spacing: -0.06em;
      line-height: 1;
    }

    .start-sub {
      margin: 0 0 20px;
      font-size: 15px;
      font-weight: 900;
      color: #333;
    }

    .start-buttons {
      display: grid;
      gap: 10px;
    }

    button {
      border: 1px solid var(--line);
      background: #fff;
      color: #111;
      font-weight: 900;
      border-radius: 999px;
      padding: 9px 14px;
      cursor: pointer;
      box-shadow: 0 2px 0 rgba(0,0,0,.12);
      user-select: none;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .start-btn {
      border: 3px solid #111;
      border-radius: 16px;
      padding: 15px 14px;
      font-size: 18px;
      box-shadow: 0 5px 0 rgba(0,0,0,.22);
    }

    .start-btn.a {
      background: #fff;
    }

    .start-btn.b {
      background: #fef2f2;
    }

	header {
	  position: relative;
	  z-index: 20;
	  background: linear-gradient(180deg, rgba(247,198,0,.98), rgba(247,198,0,.92));
	  backdrop-filter: blur(8px);
	  border-bottom: 1px solid var(--line);
	  padding: 14px 10px 12px;
	  text-align: center;
	}

    h1 {
      margin: 0 0 6px;
      font-size: clamp(21px, 5vw, 42px);
      font-weight: 1000;
      letter-spacing: -0.06em;
      line-height: 1.08;
    }

    .red {
      color: var(--accent);
    }

    .sub {
      margin: 0;
      font-size: clamp(13px, 3.2vw, 18px);
      font-weight: 900;
      line-height: 1.35;
    }

	.sync-status {
	  display: inline-flex;
	  align-items: center;
	  gap: 6px;

	  padding: 6px 10px;
	  border-radius: 999px;
	  background: rgba(255,255,255,.72);
	  border: 1px solid var(--line);

	  font-size: 11px;
	  font-weight: 900;

	  z-index: 30;
	}

    .sync-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--muted);
    }

    .sync-status.online .sync-dot {
      background: var(--green);
    }

    .sync-status.offline .sync-dot {
      background: var(--accent);
    }

    .toolbar {
      max-width: 1120px;
      margin: 12px auto 0;
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .progress-wrap {
      min-width: min(420px, 100%);
      background: rgba(255,255,255,.55);
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      height: 32px;
      position: relative;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: rgba(230,0,18,.82);
      transition: width .2s ease;
    }

    .progress-text {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-weight: 1000;
      font-size: 13px;
      color: #111;
      text-shadow: 0 1px 0 rgba(255,255,255,.75);
    }

    .search {
      width: min(250px, 100%);
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 900;
      outline: none;
      box-shadow: 0 2px 0 rgba(0,0,0,.10);
    }

    .mode-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.72);
      font-size: 15px;
      font-weight: 1000;
    }

    main {
      max-width: 1120px;
      margin: 16px auto 48px;
      padding: 0 10px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

	.summary-card {
	  background: rgba(255,255,255,.72);
	  border: 1px solid var(--line);
	  border-radius: 14px;
	  padding: 10px 12px;
	  font-weight: 1000;
	  box-shadow: 0 2px 0 rgba(0,0,0,.08);
	  text-align: center;
	}

    .summary-card small {
      display: block;
      color: #555;
      font-size: 12px;
      margin-bottom: 3px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    @media (min-width: 560px) {
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
        gap: 12px;
      }

      main {
        padding: 0 14px;
        margin-top: 22px;
      }

      .summary {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    .sticker-card {
      border: 0;
      background: rgba(255,255,255,.78);
      padding: 6px 6px 8px;
      box-shadow: 0 2px 0 rgba(0,0,0,.10);
      border-radius: 10px;
      position: relative;
      outline-offset: 3px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .image-wrap {
      position: relative;
      aspect-ratio: 68 / 93;
      width: 100%;
      min-width: 0;
    }

    .sticker-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: var(--card);
      border-radius: 5px;
      border: 1px solid rgba(0,0,0,.22);
      transition: filter .18s ease, opacity .18s ease, transform .18s ease;
    }

    .sticker-card:hover img {
      transform: scale(1.025);
    }

    .sticker-card.not-owned img {
      filter: grayscale(1) contrast(.95) brightness(.78);
      opacity: .55;
    }

    .sticker-card.owned .image-wrap::after {
      content: "획득";
      position: absolute;
      inset: auto 5px 5px 5px;
      padding: 3px 0;
      border-radius: 999px;
      background: rgba(0,0,0,.72);
      color: white;
      font-size: 11px;
      font-weight: 1000;
      text-align: center;
      letter-spacing: -0.02em;
    }

    .no-badge {
      position: absolute;
      left: 4px;
      top: 4px;
      z-index: 2;
      padding: 2px 5px;
      border-radius: 999px;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(0,0,0,.12);
      font-size: 10px;
      font-weight: 1000;
    }

    .pokemon-name {
      min-height: 20px;
      display: grid;
      place-items: center;
      font-size: clamp(11px, 3.1vw, 13px);
      font-weight: 1000;
      letter-spacing: -0.06em;
      line-height: 1.1;
      color: #111;
      word-break: keep-all;
      text-align: center;
    }

    .empty {
      grid-column: 1 / -1;
      background: rgba(255,255,255,.72);
      border-radius: 14px;
      padding: 28px 16px;
      text-align: center;
      font-weight: 1000;
    }


    .save-toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 100;
      transform: translateX(-50%) translateY(16px);
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(20, 20, 20, .86);
      color: #fff;
      font-size: 13px;
      font-weight: 1000;
      box-shadow: 0 6px 20px rgba(0,0,0,.22);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }

    .save-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    footer {
      text-align: center;
      padding: 0 16px 34px;
      color: rgba(0,0,0,.72);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.5;
    }
	
	
	.top-status-row {
	  max-width: 1120px;
	  margin: 10px auto 0;
	  display: flex;
	  flex-direction: column;
	  align-items: center;
	  gap: 4px;
	}

	.user-box {
	  display: inline-flex;
	  align-items: center;
	  gap: 8px;
	}

	.user-top {
	  display: inline-flex;
	  align-items: center;
	  gap: 8px;
	}

	.sync-mini {
	  display: inline-flex;
	  align-items: center;
	  gap: 5px;
	  font-size: 11px;
	  font-weight: 900;
	  color: #444;
	}
	
	
  </style>
</head>
<body>
  <section class="start-screen" id="startScreen">
    <div class="start-box">
      <h2 class="start-title">띠부씰 도감</h2>
      <p class="start-sub">누구의 도감을 볼까요?</p>
      <div class="start-buttons">
        <button type="button" class="start-btn a" data-user="A">이재용님의 도감</button>
        <button type="button" class="start-btn b" data-user="B">권범진님의 도감</button>
      </div>
    </div>
  </section>

  <section class="app hidden" id="app">
    <header>
      <h1>포켓몬 30주년 아트웍 스페셜 띠부씰 <span class="red">100종</span></h1>
      <p class="sub">사진을 누르면 획득 / 다시 누르면 미획득으로 변경됩니다.</p>

	<div class="top-status-row">
	  <div class="user-top">
		<div class="user-box">
		  <span class="mode-label" id="userLabel">권범진 사용자</span>
		  <button type="button" id="changeUserBtn">사용자 변경</button>
		</div>
	  </div>

	  <div class="sync-mini sync-status offline" id="syncStatus">
		<span class="sync-dot"></span>
		<span id="syncText">Firebase 설정 전 · 로컬 저장</span>
	  </div>
	</div>

      <div class="toolbar">

        <div class="progress-wrap" aria-label="수집 진행률">
          <div class="progress-bar" id="progressBar"></div>
          <div class="progress-text" id="progressText">0 / 100 수집</div>
        </div>

        <input class="search" id="searchInput" type="search" placeholder="포켓몬 이름 검색" />

        <button type="button" id="showMissing">미획득만 보기</button>
        <button type="button" id="resetBtn">현재 사용자 초기화</button>
      </div>
    </header>

    <main>
      <section class="summary" id="summary"></section>
      <div class="grid" id="grid"></div>
    </main>

    <footer>
      Firebase 설정 전에는 현재 브라우저 localStorage에 저장됩니다.<br />
      Firebase 설정 후에는 A/B 사용자의 도감이 Firestore와 실시간 동기화됩니다.
    </footer>

    <div class="save-toast" id="saveToast">저장됨 ✓</div>
  </section>

  <script type="module">
    /*
      ==========================================================
      Firebase 연동 방법
      ==========================================================

      1. Firebase 프로젝트 생성
         - https://console.firebase.google.com 접속
         - "프로젝트 추가" 클릭
         - 프로젝트 이름 입력
           예: pokemon-sticker-dex
         - Google Analytics는 필요 없으면 사용 안 함으로 만들어도 됩니다.

      2. 웹 앱 추가
         - 프로젝트 메인 화면에서 </> 웹 아이콘 클릭
         - 앱 닉네임 입력
           예: sticker-dex-web
         - "Firebase Hosting 설정"은 체크하지 않아도 됩니다.
           GitHub Pages로 올릴 거면 필요 없습니다.
         - 앱 등록 클릭

      3. firebaseConfig 복사
         - 등록 후 나오는 코드 중 아래 형태를 복사합니다.

         const firebaseConfig = {
           apiKey: "...",
           authDomain: "...",
           projectId: "...",
           storageBucket: "...",
           messagingSenderId: "...",
           appId: "..."
         };

         - 이 파일 아래에 있는 firebaseConfig 값을 실제 값으로 교체합니다.

      4. Firestore Database 생성
         - Firebase 왼쪽 메뉴에서 "빌드" > "Firestore Database"
         - "데이터베이스 만들기" 클릭
         - 처음에는 테스트 모드로 시작해도 됩니다.
         - 위치는 asia-northeast3 또는 asia-northeast1 등 가까운 곳 선택

      5. Firestore 규칙 설정
         - Firestore Database > 규칙 탭
         - 테스트용으로 아래처럼 입력 후 게시

         rules_version = '2';

         service cloud.firestore {
           match /databases/{database}/documents {
             match /{document=**} {
               allow read, write: if true;
             }
           }
         }

         주의:
         위 규칙은 링크를 아는 사람이면 누구나 읽고 쓸 수 있습니다.
         혼자/지인끼리 쓰는 테스트용으로는 편하지만,
         공개적으로 오래 운영할 거면 로그인/비밀번호 방식으로 보안을 추가하는 게 좋습니다.

      6. Firebase 사용 켜기
         - 아래 const useFirebase = false; 를
           const useFirebase = true; 로 변경합니다.

      7. GitHub Pages에 올리기
         - 이 파일 이름을 index.html 로 변경
         - assets 폴더와 함께 GitHub 저장소에 업로드
         - assets/sticker_001.png ~ assets/sticker_100.png 경로 유지
         - GitHub Pages 활성화
         - A 사용자와 B 사용자가 같은 링크로 접속하면 같은 Firestore 데이터를 공유합니다.

      데이터 저장 구조:
      Firestore 컬렉션/문서 경로는 아래와 같습니다.

      stickerDex/main

      저장 데이터 예시:
      {
        A: [1, 2, 3, 23],
        B: [4, 5, 6, 25]
      }

      즉 A 배열에는 A 사용자가 획득한 번호,
      B 배열에는 B 사용자가 획득한 번호가 저장됩니다.
    */

    const useFirebase = true;

    const firebaseConfig = {

      { no: 93, name: "잠만보", image: "assets/sticker_093.png" },
      { no: 94, name: "프리져", image: "assets/sticker_094.png" },
      { no: 95, name: "썬더", image: "assets/sticker_095.png" },
      { no: 96, name: "파이어", image: "assets/sticker_096.png" },
      { no: 97, name: "미뇽", image: "assets/sticker_097.png" },
      { no: 98, name: "신뇽", image: "assets/sticker_098.png" },
      { no: 99, name: "망나뇽", image: "assets/sticker_099.png" },
      { no: 100, name: "뮤츠", image: "assets/sticker_100.png" }
    ];

    const TOTAL = STICKERS.length;
    const STORAGE_KEY = "pokemon-30th-sticker-dex-ab-simple-v1";
    const USER_KEY = "pokemon-30th-sticker-dex-selected-user-v1";

    const startScreen = document.getElementById("startScreen");
    const app = document.getElementById("app");
    const grid = document.getElementById("grid");
    const summary = document.getElementById("summary");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");
    const resetBtn = document.getElementById("resetBtn");
    const showMissingBtn = document.getElementById("showMissing");
    const searchInput = document.getElementById("searchInput");
    const changeUserBtn = document.getElementById("changeUserBtn");
    const userLabel = document.getElementById("userLabel");
    const syncStatus = document.getElementById("syncStatus");
    const syncText = document.getElementById("syncText");
    const saveToast = document.getElementById("saveToast");

    let currentUser = localStorage.getItem(USER_KEY) || "";
    let missingOnly = false;
    let query = "";

    let db = null;
    let docRef = null;
    let saveTimer = null;
    let firebaseReady = false;

    let state = loadLocal();

    function defaultState() {
      return {
        A: [],
        B: [],
        updatedAt: Date.now()
      };
    }

    function normalizeState(raw) {
      const next = {
        A: Array.isArray(raw && raw.A) ? raw.A : [],
        B: Array.isArray(raw && raw.B) ? raw.B : [],
        updatedAt: raw && raw.updatedAt ? raw.updatedAt : Date.now()
      };

      next.A = [...new Set(next.A.map(Number).filter((no) => no >= 1 && no <= TOTAL))].sort((a, b) => a - b);
      next.B = [...new Set(next.B.map(Number).filter((no) => no >= 1 && no <= TOTAL))].sort((a, b) => a - b);

      return next;
    }

    function loadLocal() {
      try {
        const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        return normalizeState(raw);
      } catch (error) {
        return defaultState();
      }
    }

    function saveLocal() {
      state.updatedAt = Date.now();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    async function setupFirebase() {
      if (!useFirebase) {
        setSyncStatus(false, "Firebase 설정 전 · 로컬 저장");
        return;
      }

      try {
        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js");
        const {
          getFirestore,
          doc,
          getDoc,
          setDoc,
          onSnapshot,
          serverTimestamp
        } = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js");

        const appInstance = initializeApp(firebaseConfig);
        db = getFirestore(appInstance);
        docRef = doc(db, "stickerDex", DEX_ID);

        const firstSnap = await getDoc(docRef);

        if (!firstSnap.exists()) {
          await setDoc(docRef, {
            A: state.A,
            B: state.B,
            updatedAt: serverTimestamp()
          });
        }

        onSnapshot(docRef, (snapshot) => {
          if (!snapshot.exists()) return;

          state = normalizeState(snapshot.data());
          saveLocal();
          renderAll();
          setSyncStatus(true, "Firebase 실시간 동기화");
        }, (error) => {
          console.error(error);
          setSyncStatus(false, "Firebase 연결 오류 · 로컬 저장");
        });

        firebaseReady = true;
        setSyncStatus(true, "Firebase 실시간 동기화");
      } catch (error) {
        console.error(error);
        setSyncStatus(false, "Firebase 설정 확인 필요 · 로컬 저장");
      }
    }

    function setSyncStatus(online, text) {
      syncStatus.classList.toggle("online", online);
      syncStatus.classList.toggle("offline", !online);
      syncText.textContent = text;
    }


    function showSaveToast(message) {
      if (!saveToast) return;

      saveToast.textContent = message;
      saveToast.classList.add("show");

      clearTimeout(showSaveToast.timer);
      showSaveToast.timer = setTimeout(() => {
        saveToast.classList.remove("show");
      }, 1100);
    }

    function scheduleSave() {
      saveLocal();

      if (!useFirebase || !firebaseReady || !docRef) {
        showSaveToast("로컬 저장됨 ✓");
        return;
      }

      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        try {
          const { setDoc, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js");

          await setDoc(docRef, {
            A: state.A,
            B: state.B,
            updatedAt: serverTimestamp()
          }, { merge: true });

          showSaveToast("Firebase 저장됨 ✓");
        } catch (error) {
          console.error(error);
          setSyncStatus(false, "Firebase 저장 오류 · 로컬 저장");
          showSaveToast("저장 오류");
        }
      }, 200);
    }

    function isOwned(user, no) {
      return state[user].includes(no);
    }

    function toggleOwned(user, no) {
      if (isOwned(user, no)) {
        state[user] = state[user].filter((item) => item !== no);
      } else {
        state[user] = [...state[user], no].sort((a, b) => a - b);
      }

      scheduleSave();
      renderAll();
    }

    function getStats(user) {
      const owned = state[user].length;
      const missing = TOTAL - owned;
      const percent = Math.round((owned / TOTAL) * 100);

      return { owned, missing, percent };
    }

    function enterUser(user) {
      currentUser = user;
      localStorage.setItem(USER_KEY, user);
      startScreen.classList.add("hidden");
      app.classList.remove("hidden");
      missingOnly = false;
      query = "";
      searchInput.value = "";
      renderAll();
    }

    function changeUser() {
      localStorage.removeItem(USER_KEY);
      currentUser = "";
      app.classList.add("hidden");
      startScreen.classList.remove("hidden");
    }

	function updateHeader() {
	  userLabel.textContent = `${getUserName(currentUser)} 사용자`;
	  showMissingBtn.textContent = missingOnly ? "전체 보기" : "미획득만 보기";
	}

    function updateProgress() {
      const stats = getStats(currentUser);

      progressBar.style.width = `${stats.percent}%`;
      progressText.textContent = `${stats.owned} / ${TOTAL} 수집 · ${stats.percent}%`;
    }

	function renderSummary() {
	  const stats = getStats(currentUser);

	  summary.innerHTML = `
		<div class="summary-card">획득 : ${stats.owned}종</div>
		<div class="summary-card">미획득 : ${stats.missing}종</div>
		<div class="summary-card">진행률 : ${stats.percent}%</div>
		<div class="summary-card">전체 : ${TOTAL}종</div>
	  `;
	}

    function shouldShowSticker(sticker) {
      if (query && !sticker.name.includes(query)) return false;
      if (missingOnly && isOwned(currentUser, sticker.no)) return false;
      return true;
    }

    function render() {
      grid.innerHTML = "";

      const filtered = STICKERS.filter(shouldShowSticker);

      if (filtered.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "표시할 스티커가 없습니다.";
        grid.appendChild(empty);
        return;
      }

      for (const sticker of filtered) {
        grid.appendChild(createStickerCard(sticker));
      }
    }

    function createStickerCard(sticker) {
      const owned = isOwned(currentUser, sticker.no);

      const button = document.createElement("button");
      button.type = "button";
      button.className = `sticker-card ${owned ? "owned" : "not-owned"}`;
      button.title = `${String(sticker.no).padStart(3, "0")}번 ${sticker.name}`;
      button.setAttribute("aria-label", `${sticker.name} ${owned ? "획득" : "미획득"}`);

      const imageWrap = document.createElement("div");
      imageWrap.className = "image-wrap";

      const badge = document.createElement("span");
      badge.className = "no-badge";
      badge.textContent = `#${String(sticker.no).padStart(3, "0")}`;

      const img = document.createElement("img");
      img.src = sticker.image;
      img.alt = `${sticker.name} 포켓몬 스티커`;
      img.loading = "lazy";

      const name = document.createElement("div");
      name.className = "pokemon-name";
      name.textContent = sticker.name;

      imageWrap.appendChild(badge);
      imageWrap.appendChild(img);
      button.appendChild(imageWrap);
      button.appendChild(name);

	button.addEventListener("click", () => {

	  const alreadyOwned = isOwned(currentUser, sticker.no);

	  if (!alreadyOwned && navigator.vibrate) {
		navigator.vibrate(15);
	  }

	  toggleOwned(currentUser, sticker.no);
	});

      return button;
    }
	
	function getUserName(user) {
	  if (user === "A") return "이재용";
	  if (user === "B") return "권범진";
	  return user;
	}	
	
    function renderAll() {
      if (!currentUser) return;
      updateHeader();
      updateProgress();
      renderSummary();
      render();
    }

    document.querySelectorAll("[data-user]").forEach((button) => {
      button.addEventListener("click", () => {
        enterUser(button.dataset.user);
      });
    });

    changeUserBtn.addEventListener("click", changeUser);

    resetBtn.addEventListener("click", () => {
      if (!currentUser) return;
      if (!confirm(`${currentUser} 사용자의 수집 정보를 전부 초기화할까요?`)) return;

      state[currentUser] = [];
      scheduleSave();
      renderAll();
    });

    showMissingBtn.addEventListener("click", () => {
      missingOnly = !missingOnly;
      renderAll();
    });

    searchInput.addEventListener("input", (event) => {
      query = event.target.value.trim();
      render();
    });

    setupFirebase();

    if (currentUser) {
      enterUser(currentUser);
    }
  </script>
